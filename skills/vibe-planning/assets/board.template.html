<script>
(function () {
  try {
    var th = localStorage.getItem('vibe-planning.theme');
    if (th !== 'light' && th !== 'dark') th = 'dark';
    document.documentElement.setAttribute('data-theme', th);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>

<style>
  :root, html[data-theme="dark"] {
    --bg: #0B0F19;
    --panel: rgba(17, 24, 39, 0.92);
    --panel-solid: #111827;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: rgba(255, 255, 255, 0.10);
    --amber: #f59e0b;
    --btn-bg: rgba(255,255,255,0.06);
    --btn-hover: rgba(255,255,255,0.12);
    --input-bg: #0B0F19;
    --graph-a: rgba(56, 189, 248, 0.08);
    --graph-b: rgba(245, 158, 11, 0.06);
    --graph-c: #111827;
    --st-idea: #3b82f6;
    --st-proposed: #60a5fa;
    --st-planned: #a78bfa;
    --st-doing: #f59e0b;
    --st-done: #34d399;
    --st-deferred: #fb923c;
    --st-cancelled: #6b7280;
    --ghost: #38bdf8;
  }
  html[data-theme="light"] {
    --bg: #eef2f7;
    --panel: rgba(255, 255, 255, 0.90);
    --panel-solid: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: rgba(15, 23, 42, 0.12);
    --amber: #d97706;
    --btn-bg: rgba(15, 23, 42, 0.04);
    --btn-hover: rgba(15, 23, 42, 0.08);
    --input-bg: #f8fafc;
    --graph-a: rgba(37, 99, 235, 0.08);
    --graph-b: rgba(217, 119, 6, 0.07);
    --graph-c: #f8fafc;
    --st-idea: #2563eb;
    --st-proposed: #3b82f6;
    --st-planned: #7c3aed;
    --st-doing: #d97706;
    --st-done: #059669;
    --st-deferred: #ea580c;
    --st-cancelled: #6b7280;
    --ghost: #0284c7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  ::selection { background: rgba(16, 185, 129, 0.30); }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header {
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
    padding: 12px 18px; background: var(--panel); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
  header .meta { color: var(--muted); font-size: 13px; flex: 1; min-width: 120px; }
  header .actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  #btnSync {
    background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.55);
    color: #fcd34d; font-weight: 700; padding: 8px 14px; white-space: nowrap;
    box-shadow: 0 0 16px rgba(245, 158, 11, 0.18);
  }
  #btnSync:hover { background: #f59e0b; color: #0B0F19; border-color: #f59e0b; }
  #btnAiPrompt { white-space: nowrap; }
  #btnSettings { white-space: nowrap; }
  #legend { display: flex; flex-wrap: wrap; gap: 8px 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .swatch {
    width: 12px; height: 12px; border-radius: 4px; border: 2px solid transparent;
    background: #0f172a; box-shadow: 0 0 8px currentColor;
  }
  .swatch.idea { border-color: var(--st-idea); color: var(--st-idea); }
  .swatch.proposed { border-color: var(--st-proposed); color: var(--st-proposed); background: rgba(96,165,250,0.25); }
  .swatch.planned { border-color: var(--st-planned); color: var(--st-planned); background: rgba(167,139,250,0.25); }
  .swatch.doing { border-color: var(--st-doing); color: var(--st-doing); background: rgba(245,158,11,0.25); }
  .swatch.done { border-color: var(--st-done); color: var(--st-done); background: rgba(52,211,153,0.25); }
  .swatch.deferred { border-style: dashed; border-color: var(--st-deferred); color: var(--st-deferred); }
  .swatch.cancelled { border-color: var(--st-cancelled); color: var(--st-cancelled); background: #374151; }
  .swatch.ghost { border-style: dashed; border-color: var(--ghost); color: var(--ghost);
    box-shadow: 0 0 10px var(--ghost); }
  main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  #graph {
    position: relative; min-height: 0;
    background:
      radial-gradient(ellipse at 28% 18%, var(--graph-a), transparent 42%),
      radial-gradient(ellipse at 78% 72%, var(--graph-b), transparent 46%),
      radial-gradient(ellipse at 50% 50%, var(--graph-c) 0%, var(--bg) 72%);
  }
  #nodeToolbar {
    position: absolute; z-index: 10; display: none;
    gap: 6px; align-items: center;
    padding: 5px; border-radius: 999px;
    background: rgba(17, 24, 39, 0.94); backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 20px rgba(245, 158, 11, 0.12);
    pointer-events: auto; white-space: nowrap;
    transform: translate(-50%, -100%);
  }
  #nodeToolbar.show { display: inline-flex; }
  #nodeToolbar button {
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600;
    background: var(--btn-bg); border-color: var(--border);
  }
  #nodeToolbar button:hover { background: var(--btn-hover); }
  #nodeToolbar button.primary {
    background: rgba(245, 158, 11, 0.22); border-color: rgba(245, 158, 11, 0.55);
    color: #fcd34d; font-weight: 700;
  }
  #nodeToolbar button.primary:hover { background: #f59e0b; color: #0B0F19; border-color: #f59e0b; }
  aside {
    border-left: 1px solid var(--border); background: var(--panel); backdrop-filter: blur(16px);
    padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px;
  }
  aside h2 { margin: 0; font-size: 14px; font-weight: 700; }
  aside .empty { color: var(--muted); }
  aside .field { font-size: 13px; }
  aside .field b { color: var(--muted); font-weight: 500; display: block; margin-bottom: 2px; }
  aside ul { margin: 4px 0 0; padding-left: 18px; word-break: break-all; }
  button {
    appearance: none; border: 1px solid var(--border); background: var(--btn-bg); color: var(--text);
    border-radius: 12px; padding: 8px 12px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.busy::after {
    content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 8px;
    border: 2px solid var(--muted); border-top-color: var(--text); border-radius: 50%;
    vertical-align: -2px; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #syncLink { font-size: 12px; color: #fcd34d; }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(17, 24, 39, 0.95); border: 1px solid var(--border); padding: 10px 16px;
    border-radius: 14px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s; max-width: 90vw; z-index: 20;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 18px rgba(56,189,248,0.12);
  }
  #toast.show { opacity: 1; }
  #settingsModal, #promptModal {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center;
  }
  #settingsModal.open, #promptModal.open { display: flex; }
  #settingsBackdrop, #promptBackdrop {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.65);
  }
  #settingsPanel, #promptPanel {
    position: relative; z-index: 1;
    background: rgba(17, 24, 39, 0.96); border: 1px solid var(--border); border-radius: 20px;
    padding: 18px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 30px rgba(245,158,11,0.08);
    backdrop-filter: blur(18px);
  }
  #settingsPanel { width: min(360px, 92vw); }
  #promptPanel {
    width: min(720px, 94vw); max-height: min(88vh, 900px);
    display: flex; flex-direction: column; gap: 12px;
  }
  #settingsPanel h3, #promptPanel h3 {
    margin: 0 0 14px; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  #promptPanel h3 { margin: 0; }
  #settingsClose, #promptClose {
    padding: 4px 8px; font-size: 16px; line-height: 1; border: none; background: transparent;
    color: var(--muted); border-radius: 10px;
  }
  #settingsClose:hover, #promptClose:hover { color: var(--text); background: var(--btn-hover); }
  #promptText {
    width: 100%; flex: 1; min-height: 280px; max-height: 60vh;
    resize: vertical; background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px;
    font: 13px/1.45 Consolas, "Cascadia Mono", "PingFang SC", monospace;
  }
  #promptActions { display: flex; gap: 8px; justify-content: flex-end; }
  #btnCopyPrompt {
    background: rgba(245, 158, 11, 0.22); border-color: rgba(245, 158, 11, 0.55);
    color: #fcd34d; font-weight: 700;
  }
  #btnCopyPrompt:hover { background: #f59e0b; color: #0B0F19; border-color: #f59e0b; }
  .settings-row { display: flex; flex-direction: column; gap: 6px; }
  .settings-row label { font-size: 13px; color: var(--muted); }
  .settings-row { margin-bottom: 12px; }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-row select {
    appearance: none; background: var(--btn-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px;
    font-size: 14px; cursor: pointer;
  }
  .settings-row select:focus { outline: 1px solid var(--amber); }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 240px; }
    aside { border-left: 0; border-top: 1px solid var(--border); }
  }
</style>

<div id="app">
  <header>
    <h1 id="projectTitle">vibe-planning</h1>
    <span class="meta" id="projectMeta"></span>
    <div id="legend">
      <span class="chip"><span class="swatch idea"></span><span data-i18n="status.idea">idea</span></span>
      <span class="chip"><span class="swatch proposed"></span><span data-i18n="status.proposed">proposed</span></span>

      <span class="chip"><span class="swatch doing"></span><span data-i18n="status.doing">doing</span></span>

      <span class="chip"><span class="swatch deferred"></span><span data-i18n="status.deferred">deferred</span></span>
      <span class="chip"><span class="swatch cancelled"></span><span data-i18n="status.cancelled">cancelled</span></span>
      <span class="chip"><span class="swatch ghost"></span><span data-i18n="status.ghost">ghost</span></span>

      <button type="button" id="btnSync" data-i18n="sync" data-i18n-title="sync.title">Sync repo</button>

      <button type="button" id="btnSettings" data-i18n="settings">⚙ Settings</button>
      <a id="syncLink" href="/api/sync-prompt" target="_blank" hidden data-i18n="sync.promptLink">sync-prompt</a>
    </div>
  </header>
  <main>
    <div id="graph"></div>
    <aside>
      <h2 data-i18n="detail.heading">Node</h2>

      <button id="btnSuggest" disabled data-i18n="suggest">Suggest from here</button>
      <div class="field" id="ghostHint" hidden>
        <b data-i18n="ghost.preview">Ghost preview</b>
        <ul id="ghostList"></ul>
      </div>

  </main>
</div>
<div id="nodeToolbar" role="toolbar" aria-label="Node actions" hidden>
  <button type="button" id="btnInspire" class="primary" data-i18n="toolbar.inspire">启发</button>
  <button type="button" id="btnAdvance" data-i18n="toolbar.advance">推进</button>
</div>
<div id="toast"></div>
<div id="settingsModal" aria-hidden="true">
  <div id="settingsBackdrop"></div>
  <div id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h3>
      <span id="settingsTitle" data-i18n="settings.title">Settings</span>
      <button type="button" id="settingsClose" data-i18n-title="settings.close" title="Close">×</button>

      <label for="localeSelect" data-i18n="settings.language">Language</label>
      <select id="localeSelect">
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="settings-row">
      <label for="themeSelect" data-i18n="settings.theme">Theme</label>
      <select id="themeSelect">
        <option value="dark" data-i18n="settings.theme.dark">Dark</option>
        <option value="light" data-i18n="settings.theme.light">Light</option>
      </select>

  </div>
</div>
<div id="promptModal" aria-hidden="true">
  <div id="promptBackdrop"></div>
  <div id="promptPanel" role="dialog" aria-modal="true" aria-labelledby="promptTitle">
    <h3>
      <span id="promptTitle" data-i18n="aiPrompt.title">AI sync prompt</span>
      <button type="button" id="promptClose" data-i18n-title="aiPrompt.close" title="Close">×</button>

    <textarea id="promptText" readonly spellcheck="false"></textarea>
    <div id="promptActions">
      <button type="button" id="btnPromptClose" data-i18n="aiPrompt.close">Close</button>
      <button type="button" id="btnCopyPrompt" data-i18n="aiPrompt.copy">Copy</button>

  </div>
</div>

  const I18N = {

      'toast.syncFailWith': 'Sync failed: ',
      'toast.generating': 'Generating AI prompt…',
      'toast.copied': 'Copied to clipboard',
      'toast.fail': 'Failed to generate',
    },
  };

  let locale = detectLocale();

  function detectLocale() {
    try {
      var stored = localStorage.getItem('vibe-planning.locale');
      if (stored === 'zh-CN' || stored === 'en') return stored;
    } catch (e) { /* ignore */ }
    var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
    return nav.indexOf('zh') === 0 ? 'zh-CN' : 'en';
  }

  function t(key) {
    var pack = I18N[locale] || I18N.en;
    if (pack[key] != null) return pack[key];
    if (I18N.en[key] != null) return I18N.en[key];
    return key;
  }

  function statusLabel(code) {
    var key = 'status.' + (code || 'idea');
    var label = t(key);
    return label === key ? (code || '') : label;
  }

  function applyLocale() {
    document.documentElement.lang = locale;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (key) el.textContent = t(key);
    });
    document.querySelectorAll('[data-i18n-title]').forEach(function (el) {
      var key = el.getAttribute('data-i18n-title');
      if (key) el.setAttribute('title', t(key));
    });
    var sel = document.getElementById('localeSelect');
    if (sel) sel.value = locale;
    if (syncPromptWritten) {
      var link = document.getElementById('syncLink');
      if (link) link.textContent = t('sync.wrotePrompt');
    }
    updateMeta();
    if (selected) showDetail(selected);
    else {
      var detailEl = document.getElementById('detail');
      if (detailEl && detailEl.classList.contains('empty')) {
        detailEl.textContent = t('detail.empty');
      }
    }
    positionToolbar();
  }

  function setLocale(next) {
    if (next !== 'zh-CN' && next !== 'en') return;
    locale = next;
    try { localStorage.setItem('vibe-planning.locale', locale); } catch (e) { /* ignore */ }
    applyLocale();
  }

  let theme = detectTheme();

  function detectTheme() {
    try {
      var stored = localStorage.getItem('vibe-planning.theme');
      if (stored === 'light' || stored === 'dark') return stored;
    } catch (e) { /* ignore */ }
    return 'dark';
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    var sel = document.getElementById('themeSelect');
    if (sel) sel.value = theme;
  }

  function setTheme(next) {
    if (next !== 'light' && next !== 'dark') return;
    theme = next;
    try { localStorage.setItem('vibe-planning.theme', theme); } catch (e) { /* ignore */ }
    applyTheme();
    if (data) renderTree(data, { force: true });
  }

  function clearBlurTimer() {

  function scheduleHideToolbar() {

      else positionToolbar();

  var subtreeDrag = null;

  function collectDescendantIds(rootId) {
    var all = (data.nodes || []).concat(data.ghosts || []);
    var kids = {};
    for (var i = 0; i < all.length; i++) {
      var n = all[i];
      if (!n || !n.id || !n.parent) continue;
      if (!kids[n.parent]) kids[n.parent] = [];
      kids[n.parent].push(n.id);
    }
    var out = [];
    var stack = [rootId];
    var seen = {};
    seen[rootId] = true;
    while (stack.length) {
      var id = stack.pop();
      var ch = kids[id] || [];
      for (var j = 0; j < ch.length; j++) {
        var cid = ch[j];
        if (seen[cid]) continue;
        seen[cid] = true;
        out.push(cid);
        stack.push(cid);
      }
    }
    return out;
  }

  function normalizePositions(posMap) {
    var out = {};
    if (!posMap) return out;
    Object.keys(posMap).forEach(function (id) {
      var p = posMap[id];
      if (!p) return;
      var x = Number(p.x);
      var y = Number(p.y);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return;
      out[id] = { x: x, y: y };
    });
    return out;
  }

  function saveLayout(positions) {
    var cleaned = normalizePositions(positions);
    Object.keys(cleaned).forEach(function (id) {
      layoutPositions[id] = cleaned[id];
    });
    if (!liveEnabled()) return;
    fetch('/api/layout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ positions: cleaned }),
    }).catch(function (err) {
      console.warn('[vibe-planning] saveLayout failed', err);
    });
  }

  function scheduleSaveLayout(net) {
    if (!net) return;
    clearTimeout(layoutSaveTimer);
    layoutSaveTimer = setTimeout(function () {
      layoutSaveTimer = null;
      try { saveLayout(net.getPositions()); } catch (e) {
        console.warn('[vibe-planning] saveLayout failed', e);
      }
    }, 250);
  }

  function flushSaveLayout(net) {
    clearTimeout(layoutSaveTimer);
    layoutSaveTimer = null;
    if (!net) return;
    try { saveLayout(net.getPositions()); } catch (e) {
      console.warn('[vibe-planning] saveLayout failed', e);
    }
  }

  async function fetchLayout() {
    try {
      var res = await fetch('/api/layout', { cache: 'no-store' });
      if (!res.ok) return;
      var json = await res.json();
      var next = normalizePositions(json && json.positions);
      Object.keys(next).forEach(function (id) {
        layoutPositions[id] = next[id];
      });
    } catch (e) {
      console.warn('[vibe-planning] fetchLayout failed', e);
    }
  }

  function applyLayoutToNodes(nodesArr) {
    var applied = 0;
    (nodesArr || []).forEach(function (n) {
      var s = layoutPositions[n.id];
      if (!s) return;
      n.x = s.x;
      n.y = s.y;
      applied++;
    });
    return applied;
  }

  function earliestDocDate(n) {
    var best = '9999-99-99';
    var docs = (n && n.docs) || [];
    for (var i = 0; i < docs.length; i++) {
      var m = String(docs[i]).match(/(\d{4}-\d{2}-\d{2})/);
      if (m && m[1] < best) best = m[1];
    }
    return best;
  }

  function ensureDoneOrder(tree) {
    var dirty = false;
    var max = 0;
    Object.keys(doneOrderMap).forEach(function (id) {
      var v = Number(doneOrderMap[id]);
      if (Number.isFinite(v) && v > max) max = v;
    });
    var missing = (tree.nodes || []).filter(function (n) {
      return n && n.status === 'done' && n.id && doneOrderMap[n.id] == null;
    });
    missing.sort(function (a, b) {
      var da = earliestDocDate(a);
      var db = earliestDocDate(b);
      if (da !== db) return da < db ? -1 : 1;
      return String(a.id).localeCompare(String(b.id));
    });
    for (var i = 0; i < missing.length; i++) {
      max += 1;
      doneOrderMap[missing[i].id] = max;
      dirty = true;
    }
    if (dirty && liveEnabled()) {
      fetch('/api/done-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: doneOrderMap }),
      }).catch(function (err) {
        console.warn('[vibe-planning] saveDoneOrder failed', err);
      });
    }
    return dirty;
  }

  async function fetchDoneOrder() {
    try {
      var res = await fetch('/api/done-order', { cache: 'no-store' });
      if (!res.ok) return;
      var json = await res.json();
      var order = json && json.order && typeof json.order === 'object' ? json.order : {};
      Object.keys(order).forEach(function (id) {
        var n = Number(order[id]);
        if (Number.isFinite(n) && n >= 1) doneOrderMap[id] = Math.floor(n);
      });
    } catch (e) {
      console.warn('[vibe-planning] fetchDoneOrder failed', e);
    }
  }

  function drawDoneBadges(ctx, net) {
    if (!nodesDS || !ctx || !net) return;
    var ids = nodesDS.getIds();
    for (var i = 0; i < ids.length; i++) {
      var node = nodesDS.get(ids[i]);
      if (!node || !node._raw || node._raw.status !== 'done') continue;
      var seq = node._doneSeq;
      if (seq == null) continue;
      var box = net.getBoundingBox(ids[i]);
      if (!box) continue;
      var r = 12;
      var x = box.right + 3;
      var y = box.top - 3;
      var label = String(seq);
      ctx.save();
      ctx.shadowColor = 'rgba(245, 158, 11, 0.85)';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.stroke();
      ctx.fillStyle = '#0B0F19';
      ctx.font = 'bold ' + (label.length > 2 ? 10 : 12) + 'px Segoe UI, PingFang SC, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, x, y + 0.5);
      ctx.restore();
    }
  }

  function wireNetworkToolbar(net) {
    net.on('hoverNode', function (p) {
      clearBlurTimer();
      hoverNodeId = p.node;
      positionToolbar();
    });
    net.on('blurNode', function () {
      scheduleHideToolbar();
    });
    net.on('dragStart', function (p) {
      if (!p.nodes || !p.nodes.length) {
        subtreeDrag = null;
        return;
      }
      var rootId = p.nodes[0];
      var pos = net.getPositions([rootId])[rootId];
      if (!pos) {
        subtreeDrag = null;
        return;
      }
      subtreeDrag = {
        rootId: rootId,
        lastX: pos.x,
        lastY: pos.y,
        childIds: collectDescendantIds(rootId),
      };
    });
    net.on('dragging', function (p) {
      positionToolbar();
      if (!subtreeDrag) return;
      if (!p.nodes || p.nodes.indexOf(subtreeDrag.rootId) < 0) return;
      var pos = net.getPositions([subtreeDrag.rootId])[subtreeDrag.rootId];
      if (!pos) return;
      var dx = pos.x - subtreeDrag.lastX;
      var dy = pos.y - subtreeDrag.lastY;
      subtreeDrag.lastX = pos.x;
      subtreeDrag.lastY = pos.y;
      if (dx || dy) {
        var ids = subtreeDrag.childIds;
        if (ids.length) {
          var positions = net.getPositions(ids);
          for (var i = 0; i < ids.length; i++) {
            var id = ids[i];
            var c = positions[id];
            if (!c) continue;
            net.moveNode(id, c.x + dx, c.y + dy);
          }
        }
        scheduleSaveLayout(net);
      }
    });
    net.on('dragEnd', function () {
      flushSaveLayout(net);
      subtreeDrag = null;
      positionToolbar();
    });
    net.on('zoom', function () { positionToolbar(); });
    net.on('animationFinished', function () { positionToolbar(); });
    net.on('afterDrawing', function (ctx) {
      drawDoneBadges(ctx, net);
      if (nodeToolbar.classList.contains('show') || activeToolbarId()) positionToolbar();
    });
  }

  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function computeDepths(allRaw) {
    var byId = {};
    allRaw.forEach(function (n) { if (n && n.id) byId[n.id] = n; });
    var memo = {};
    var visiting = {};

    function depthOf(id) {
      if (memo[id] != null) return memo[id];
      if (visiting[id]) return 0;
      visiting[id] = true;
      var n = byId[id];
      var best = 0;
      if (n) {
        var deps = Array.isArray(n.dependsOn) ? n.dependsOn : [];
        for (var i = 0; i < deps.length; i++) {
          if (!deps[i] || !byId[deps[i]]) continue;
          var d = depthOf(deps[i]) + 1;
          if (d > best) best = d;
        }
        if (n.parent && byId[n.parent]) {
          var p = depthOf(n.parent) + 0.55;
          if (p > best) best = p;
        }
      }
      visiting[id] = false;
      memo[id] = best;
      return best;
    }

    allRaw.forEach(function (n) { if (n && n.id) depthOf(n.id); });
    return memo;
  }

  var GAP_X = 210;
  var GAP_Y = 175;
  var BOX_W = 170;
  var BOX_H = 48;

  function spreadSeeds(nodesArr, depths) {
    var byLevel = {};
    nodesArr.forEach(function (n) {
      var lv = Math.round((depths[n.id] || 0) * 2) / 2;
      if (!byLevel[lv]) byLevel[lv] = [];
      byLevel[lv].push(n);
    });
    Object.keys(byLevel).forEach(function (lv) {
      var arr = byLevel[lv];
      arr.sort(function (a, b) {
        return String(a.id).localeCompare(String(b.id));
      });
      var start = -((arr.length - 1) * GAP_X) / 2;
      arr.forEach(function (n, i) {
        var h = hashStr(String(n.id));
        n.x = start + i * GAP_X + ((h % 36) - 18);
        n.y = Number(lv) * GAP_Y + (((h >> 8) % 28) - 14);
      });
    });
  }

  function resolveOverlaps(positions) {
    var ids = Object.keys(positions);
    var pad = 16;
    for (var pass = 0; pass < 8; pass++) {
      for (var i = 0; i < ids.length; i++) {
        for (var j = i + 1; j < ids.length; j++) {
          var a = positions[ids[i]];
          var b = positions[ids[j]];
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var minX = BOX_W + pad;
          var minY = BOX_H + pad;
          var ox = minX - Math.abs(dx);
          var oy = minY - Math.abs(dy);
          if (ox <= 0 || oy <= 0) continue;
          if (ox < oy) {
            var sx = (dx === 0 ? (i % 2 ? 1 : -1) : (dx > 0 ? 1 : -1)) * (ox / 2 + 2);
            a.x -= sx;
            b.x += sx;
          } else {
            var sy = (dy === 0 ? (i % 2 ? 1 : -1) : (dy > 0 ? 1 : -1)) * (oy / 2 + 2);
            a.y -= sy;
            b.y += sy;
          }
        }
      }
    }
    return positions;
  }

  function buildGraphData(tree) {
    const idSet = new Set();
    const nodesArr = [];
    const edgesArr = [];
    const list = (tree.nodes || []).slice().sort(function (a, b) {
      const sa = STATUS_ORDER[a.status] != null ? STATUS_ORDER[a.status] : 9;
      const sb = STATUS_ORDER[b.status] != null ? STATUS_ORDER[b.status] : 9;
      if (sa !== sb) return sa - sb;
      return String(a.title || a.id).localeCompare(String(b.title || b.id), 'zh');
    });
    const ghosts = tree.ghosts || [];
    const allRaw = list.concat(ghosts);
    const depths = computeDepths(allRaw);

    function addNode(n, isGhost) {
      if (!n || !n.id || idSet.has(n.id)) return;
      idSet.add(n.id);
      const st = styleFor(n.status || 'idea', isGhost);
      var doneSeq = (!isGhost && n.status === 'done' && doneOrderMap[n.id] != null)
        ? doneOrderMap[n.id]
        : null;
      var tip = (isGhost ? '[ghost] ' : '') + (n.title || n.id) + '\n' + (n.status || '');
      if (doneSeq != null) tip += '\n#' + doneSeq;
      nodesArr.push({
        id: n.id,
        label: n.title || n.id,
        title: tip,
        ...st,
        _raw: n,
        _ghost: !!isGhost,
        _doneSeq: doneSeq,
      });
    }

    function addEdges(n) {
      var light = theme === 'light';
      if (n.parent) {
        edgesArr.push({
          id: 'p:' + n.parent + '>' + n.id,
          from: n.parent, to: n.id, arrows: { to: { enabled: true, scaleFactor: 0.85 } },
          color: {
            color: light ? 'rgba(75, 85, 99, 0.9)' : 'rgba(156, 163, 175, 0.95)',
            highlight: light ? '#d97706' : '#f59e0b',
            hover: light ? '#b45309' : '#fcd34d',
            opacity: 0.95,
          },
          width: 3.5,
          selectionWidth: 5,
          length: 140,
          smooth: false,
          shadow: {
            enabled: true,
            color: light ? 'rgba(75,85,99,0.25)' : 'rgba(156,163,175,0.45)',
            size: 10, x: 0, y: 0,
          },
        });
      }
      const deps = Array.isArray(n.dependsOn) ? n.dependsOn : [];
      for (const d of deps) {
        if (!d) continue;
        edgesArr.push({
          id: 'd:' + d + '>' + n.id,
          from: d, to: n.id, arrows: { to: { enabled: true, scaleFactor: 0.75 } },
          color: {
            color: light ? 'rgba(2, 132, 199, 0.55)' : 'rgba(56, 189, 248, 0.55)',
            highlight: light ? '#0284c7' : '#38bdf8',
            hover: light ? '#0369a1' : '#7dd3fc',
            opacity: 0.7,
          },
          width: 2.5,
          selectionWidth: 4,
          dashes: [8, 6],
          length: 230,
          smooth: false,
          shadow: {
            enabled: true,
            color: light ? 'rgba(2,132,199,0.25)' : 'rgba(56,189,248,0.35)',
            size: 12, x: 0, y: 0,
          },
        });
      }
    }

    list.forEach(function (n) { addNode(n, false); });
    ghosts.forEach(function (n) { addNode(n, true); });
    spreadSeeds(nodesArr, depths);
    applyLayoutToNodes(nodesArr);
    list.forEach(addEdges);
    ghosts.forEach(addEdges);
    return { nodesArr: nodesArr, edgesArr: edgesArr };
  }

  const netOpts = {
    physics: {
      enabled: true,
      solver: 'barnesHut',
      barnesHut: {
        gravitationalConstant: -6500,
        centralGravity: 0.06,
        springLength: 150,
        springConstant: 0.035,
        damping: 0.45,
        avoidOverlap: 1,
      },
      stabilization: { iterations: 220, fit: true },
    },
    interaction: { hover: true, tooltipDelay: 120, dragNodes: true },
    nodes: {
      shape: 'box',
      margin: 12,
      borderWidth: 4,
      widthConstraint: { minimum: 96, maximum: 168 },
      heightConstraint: { minimum: 40 },
      shadow: true,
    },
    edges: {
      smooth: false,
      width: 3,
      shadow: true,
      color: { inherit: false },
    },
    layout: {
      hierarchical: { enabled: false },
      improvedLayout: false,
    },
  };

  let lastTreeFp = '';
  let lastStructFp = '';
  let didInitialFit = false;

  function treeFingerprint(tree) {
    try { return JSON.stringify(tree || {}); } catch { return String(Date.now()); }
  }

  function structureFingerprint(built) {
    const n = (built.nodesArr || []).map(function (x) { return x.id; }).sort().join(',');
    const e = (built.edgesArr || []).map(function (x) { return x.id || (x.from + '>' + x.to); }).sort().join(',');
    return n + '|' + e;
  }

  function stabilizeThenFreeze(doFit) {
    if (!network || !nodesDS) return;
    var ids = nodesDS.getIds();
    var fixedIds = [];
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      if (!layoutPositions[id]) continue;
      nodesDS.update({ id: id, fixed: { x: true, y: true } });
      fixedIds.push(id);
    }
    function unfixSaved() {
      for (var j = 0; j < fixedIds.length; j++) {
        nodesDS.update({ id: fixedIds[j], fixed: false });
      }
    }
    function applyFinal(doPhysicsCleanup) {
      network.setOptions({ physics: { enabled: false } });
      var pos = doPhysicsCleanup ? resolveOverlaps(network.getPositions()) : network.getPositions();
      Object.keys(layoutPositions).forEach(function (id) {
        if (!pos[id]) return;
        pos[id] = { x: layoutPositions[id].x, y: layoutPositions[id].y };
      });
      Object.keys(pos).forEach(function (id) {
        network.moveNode(id, pos[id].x, pos[id].y);
      });
      unfixSaved();
      if (doFit || !didInitialFit) {
        network.fit({ animation: false });
        didInitialFit = true;
      }
    }
    if (fixedIds.length && fixedIds.length === ids.length) {
      applyFinal(false);
      return;
    }
    network.setOptions({ physics: { enabled: true } });
    network.once('stabilizationIterationsDone', function () {
      applyFinal(true);
    });
  }

  function renderTree(tree, opts) {
    opts = opts || {};
    const next = tree || data;
    const fp = treeFingerprint(next);
    if (!opts.force && fp && fp === lastTreeFp && network) {
      return;
    }
    lastTreeFp = fp;
    data = next;
    window.PLAN_TREE = data;
    updateMeta();
    const built = buildGraphData(data);
    const structFp = structureFingerprint(built);
    const structureChanged = structFp !== lastStructFp;

    if (!network) {
      lastStructFp = structFp;
      nodesDS = new vis.DataSet(built.nodesArr);
      edgesDS = new vis.DataSet(built.edgesArr);
      var graphEl = document.getElementById('graph');
      network = new vis.Network(
        graphEl,
        { nodes: nodesDS, edges: edgesDS },
        netOpts
      );
      // vis-network clears container children; re-attach floating toolbar
      nodeToolbar.hidden = false;
      graphEl.appendChild(nodeToolbar);
      network.on('click', function (p) {
        if (!p.nodes.length) {
          hoverNodeId = null;
          showDetail(null);
          hideToolbar();
          return;
        }
        showDetail(nodesDS.get(p.nodes[0]));
      });
      wireNetworkToolbar(network);
      stabilizeThenFreeze(true);
      return;
    }

    const pos = network.getPositions();
    const sel = selected && selected.id;
    const byId = {};
    built.nodesArr.forEach(function (n) {
      if (pos[n.id]) {
        n.x = pos[n.id].x;
        n.y = pos[n.id].y;
      } else if (layoutPositions[n.id]) {
        n.x = layoutPositions[n.id].x;
        n.y = layoutPositions[n.id].y;
      }
      byId[n.id] = n;
    });

    const keepIds = new Set(Object.keys(byId));
    nodesDS.getIds().forEach(function (id) {
      if (!keepIds.has(id)) nodesDS.remove(id);
    });
    built.nodesArr.forEach(function (n) {
      if (nodesDS.get(n.id)) nodesDS.update(n);
      else nodesDS.add(n);
    });

    const edgeIds = new Set(built.edgesArr.map(function (e) { return e.id; }));
    edgesDS.getIds().forEach(function (id) {
      if (!edgeIds.has(id)) edgesDS.remove(id);
    });
    built.edgesArr.forEach(function (e) {
      if (edgesDS.get(e.id)) edgesDS.update(e);
      else edgesDS.add(e);
    });

    lastStructFp = structFp;
    if (structureChanged || opts.forcePhysics) {
      stabilizeThenFreeze(!!opts.forceFit);
    } else {
      network.setOptions({ physics: { enabled: false } });
    }

    if (sel && nodesDS.get(sel)) {
      showDetail(nodesDS.get(sel));
      network.selectNodes([sel]);
    }
  }

  const detail = document.getElementById('detail');
  const btn = document.getElementById('btnSuggest');
  const btnSync = document.getElementById('btnSync');
  const btnAiPrompt = document.getElementById('btnAiPrompt');
  const btnSettings = document.getElementById('btnSettings');
  const syncLink = document.getElementById('syncLink');
  const ghostHint = document.getElementById('ghostHint');
  const ghostList = document.getElementById('ghostList');
  const settingsModal = document.getElementById('settingsModal');
  const settingsBackdrop = document.getElementById('settingsBackdrop');
  const settingsClose = document.getElementById('settingsClose');
  const localeSelect = document.getElementById('localeSelect');
  const promptModal = document.getElementById('promptModal');
  const promptBackdrop = document.getElementById('promptBackdrop');
  const promptClose = document.getElementById('promptClose');
  const btnPromptClose = document.getElementById('btnPromptClose');
  const btnCopyPrompt = document.getElementById('btnCopyPrompt');
  const promptText = document.getElementById('promptText');

  function openSettings() {
    settingsModal.classList.add('open');
    settingsModal.setAttribute('aria-hidden', 'false');
    localeSelect.focus();
  }

  function closeSettings() {
    settingsModal.classList.remove('open');
    settingsModal.setAttribute('aria-hidden', 'true');
  }

  function openPromptModal(text) {
    promptText.value = text || '';
    promptModal.classList.add('open');
    promptModal.setAttribute('aria-hidden', 'false');
    promptText.focus();
    promptText.select();
  }

  function closePromptModal() {
    promptModal.classList.remove('open');
    promptModal.setAttribute('aria-hidden', 'true');
  }

  btnSettings.addEventListener('click', openSettings);
  settingsClose.addEventListener('click', closeSettings);
  settingsBackdrop.addEventListener('click', closeSettings);
  promptClose.addEventListener('click', closePromptModal);
  btnPromptClose.addEventListener('click', closePromptModal);
  promptBackdrop.addEventListener('click', closePromptModal);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (promptModal.classList.contains('open')) closePromptModal();
    else if (settingsModal.classList.contains('open')) closeSettings();
  });
  const themeSelect = document.getElementById('themeSelect');
  themeSelect.addEventListener('change', function () {
    setTheme(themeSelect.value);
  });
  localeSelect.addEventListener('change', function () {
    setLocale(localeSelect.value);
  });

  btnCopyPrompt.addEventListener('click', function () {
    var text = promptText.value || '';
    function done() { toast(t('toast.copied')); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        promptText.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { window.prompt(t('toast.copyPrompt'), text); done(); }
      });
    } else {
      promptText.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { window.prompt(t('toast.copyPrompt'), text); done(); }
    }
  });

  function relatedGhosts(nodeId) {
    return (data.ghosts || []).filter(function (g) {
      return g.parent === nodeId ||
        (Array.isArray(g.dependsOn) && g.dependsOn.indexOf(nodeId) >= 0);
    });
  }

  function showDetail(node) {
    selected = node;
    if (!node) {
      detail.className = 'empty';
      detail.removeAttribute('data-i18n');
      detail.textContent = t('detail.empty');
      btn.disabled = true;
      ghostHint.hidden = true;
      if (!hoverNodeId) hideToolbar();
      else positionToolbar();
      return;
    }
    const r = node._raw || {};
    detail.className = '';
    detail.removeAttribute('data-i18n');
    const docs = (r.docs || []).map(function (d) { return '<li>' + d + '</li>'; }).join('');
    const stCode = r.status || '';
    const stShown = stCode ? (statusLabel(stCode) + ' <span style="color:var(--muted)">(' + stCode + ')</span>') : '';
    detail.innerHTML =
      '<div class="field"><b>' + t('field.id') + '</b>' + r.id +
        (node._ghost ? ' <em>' + t('ghost.tag') + '</em>' : '') + '</div>' +
      '<div class="field"><b>' + t('field.title') + '</b>' + (r.title || '') + '</div>' +
      '<div class="field"><b>' + t('field.status') + '</b>' + stShown + '</div>' +
      (r.kind ? '<div class="field"><b>' + t('field.kind') + '</b>' + r.kind + '</div>' : '') +
      (r.parent ? '<div class="field"><b>' + t('field.parent') + '</b>' + r.parent + '</div>' : '') +
      (r.dependsOn && r.dependsOn.length
        ? '<div class="field"><b>' + t('field.dependsOn') + '</b>' + r.dependsOn.join(', ') + '</div>' : '') +
      (docs ? '<div class="field"><b>' + t('field.docs') + '</b><ul>' + docs + '</ul></div>' : '') +
      (r.notes ? '<div class="field"><b>' + t('field.notes') + '</b>' + r.notes + '</div>' : '');
    btn.disabled = !!node._ghost;

    const gs = relatedGhosts(r.id);
    if (gs.length) {
      ghostHint.hidden = false;
      ghostList.innerHTML = gs.map(function (g) {
        return '<li>' + g.id + ' — ' + (g.title || '') + '</li>';
      }).join('');
    } else {
      ghostHint.hidden = true;
    }
    positionToolbar();
  }

  btn.addEventListener('click', function () {
    if (!selected || selected._ghost) return;
    copyText(buildInspirePrompt(selected._raw || {}), 'toast.inspireCopied');
  });

  btnSync.addEventListener('click', async function () {
    btnSync.disabled = true;
    btnSync.classList.add('busy');
    toast(t('toast.syncing'));
    try {
      const res = await fetch('/api/sync', { method: 'POST' });
      const json = await res.json();
      lastSyncSummary = json.summary || '';
      updateMeta();
      if (json.promptPath) {
        syncPromptWritten = true;
        syncLink.hidden = false;
        syncLink.textContent = t('sync.wrotePrompt');
      }
      toast(json.summary || (json.ok ? t('toast.syncDone') : t('toast.syncFail')));
      await reloadTree({ force: true });
    } catch (e) {
      toast(t('toast.syncFailWith') + (e && e.message ? e.message : e));
    } finally {
      btnSync.disabled = false;
      btnSync.classList.remove('busy');
    }
  });

  btnAiPrompt.addEventListener('click', async function () {
    btnAiPrompt.disabled = true;
    btnAiPrompt.classList.add('busy');
    toast(t('toast.generating'));
    try {
      const res = await fetch('/api/ai-sync-prompt', { method: 'POST' });
      const json = await res.json();
      if (!json.ok || !json.prompt) {
        toast(json.summary || t('toast.fail'));
        return;
      }
      openPromptModal(json.prompt);
    } catch (e) {
      toast(t('toast.fail') + ': ' + (e && e.message ? e.message : e));
    } finally {
      btnAiPrompt.disabled = false;
      btnAiPrompt.classList.remove('busy');
    }
  });

  function liveEnabled() {
    return location.protocol === 'http:' || location.protocol === 'https:';
  }

  async function reloadTree(opts) {
    try {
      const res = await fetch('/api/tree', { cache: 'no-store' });
      if (!res.ok) return;
      const tree = await res.json();
      await fetchLayout();
      await fetchDoneOrder();
      ensureDoneOrder(tree);
      renderTree(tree, opts || {});
    } catch { /* static file:// bootstrap */ }
  }

  applyTheme();
  applyLocale();

  if (liveEnabled()) {
    reloadTree({ force: true, forcePhysics: true, forceFit: true });
    try {
      const es = new EventSource('/api/events');
      es.addEventListener('reload', function () { reloadTree(); });
      es.onerror = function () { /* ignore; poll is slow backup */ };
    } catch { /* ignore */ }
    setInterval(function () { reloadTree(); }, 10000);
  } else {
    renderTree(data, { force: true, forcePhysics: true, forceFit: true });
  }
})();
</script>
</body>
</html>
