<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="pageTitle">vibe-planning</title>
<meta name="vp-board-rev" content="2026-07-30-theme-toggle" />
<script>
(function () {
  try {
    var th = localStorage.getItem('vibe-planning.theme');
    if (th !== 'light' && th !== 'dark') th = 'dark';
    document.documentElement.setAttribute('data-theme', th);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root, html[data-theme="dark"] {
    --bg: #0B0F19;
    --panel: rgba(17, 24, 39, 0.92);
    --panel-solid: #111827;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: rgba(255, 255, 255, 0.10);
    --amber: #f59e0b;
    --btn-bg: rgba(255,255,255,0.06);
    --btn-hover: rgba(255,255,255,0.12);
    --input-bg: #0B0F19;
    --graph-a: rgba(56, 189, 248, 0.08);
    --graph-b: rgba(245, 158, 11, 0.06);
    --graph-c: #111827;
    --st-idea: #3b82f6;
    --st-proposed: #60a5fa;
    --st-planned: #a78bfa;
    --st-doing: #f59e0b;
    --st-done: #34d399;
    --st-deferred: #fb923c;
    --st-cancelled: #6b7280;
    --ghost: #38bdf8;
  }
  html[data-theme="light"] {
    --bg: #eef2f7;
    --panel: rgba(255, 255, 255, 0.90);
    --panel-solid: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: rgba(15, 23, 42, 0.12);
    --amber: #d97706;
    --btn-bg: rgba(15, 23, 42, 0.04);
    --btn-hover: rgba(15, 23, 42, 0.08);
    --input-bg: #f8fafc;
    --graph-a: rgba(37, 99, 235, 0.08);
    --graph-b: rgba(217, 119, 6, 0.07);
    --graph-c: #f8fafc;
    --st-idea: #2563eb;
    --st-proposed: #3b82f6;
    --st-planned: #7c3aed;
    --st-doing: #d97706;
    --st-done: #059669;
    --st-deferred: #ea580c;
    --st-cancelled: #6b7280;
    --ghost: #0284c7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  ::selection { background: rgba(16, 185, 129, 0.30); }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header {
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
    padding: 12px 18px; background: var(--panel); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
  header .meta { color: var(--muted); font-size: 13px; flex: 1; min-width: 120px; }
  header .actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  #btnSync {
    background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.55);
    color: #fcd34d; font-weight: 700; padding: 8px 14px; white-space: nowrap;
    box-shadow: 0 0 16px rgba(245, 158, 11, 0.18);
  }
  #btnSync:hover { background: #f59e0b; color: #0B0F19; border-color: #f59e0b; }
  #btnRelayout { white-space: nowrap; }
  #btnSettings { white-space: nowrap; }
  #btnTour { white-space: nowrap; }
  #legend { display: flex; flex-wrap: wrap; gap: 8px 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .swatch {
    width: 12px; height: 12px; border-radius: 8px; border: 2px solid transparent;
    background: #0f172a; box-shadow: 0 0 8px currentColor;
  }
  .swatch.idea { border-color: var(--st-idea); color: var(--st-idea); }
  .swatch.proposed { border-color: var(--st-proposed); color: var(--st-proposed); background: rgba(96,165,250,0.25); }
  .swatch.planned { border-color: var(--st-planned); color: var(--st-planned); background: rgba(167,139,250,0.25); }
  .swatch.doing { border-color: var(--st-doing); color: var(--st-doing); background: rgba(245,158,11,0.25); }
  .swatch.done { border-color: var(--st-done); color: var(--st-done); background: rgba(52,211,153,0.25); }
  .swatch.deferred { border-style: dashed; border-color: var(--st-deferred); color: var(--st-deferred); }
  .swatch.cancelled { border-color: var(--st-cancelled); color: var(--st-cancelled); background: #374151; }
  .swatch.ghost { border-style: dashed; border-color: var(--ghost); color: var(--ghost);
    box-shadow: 0 0 10px var(--ghost); }
  main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  #graph {
    position: relative; min-height: 0;
    background:
      radial-gradient(ellipse at 28% 18%, var(--graph-a), transparent 42%),
      radial-gradient(ellipse at 78% 72%, var(--graph-b), transparent 46%),
      radial-gradient(ellipse at 50% 50%, var(--graph-c) 0%, var(--bg) 72%);
  }
  #nodeToolbar {
    position: absolute; z-index: 10; display: inline-flex;
    gap: 4px; align-items: center;
    padding: 4px; border-radius: 999px;
    background: rgba(17, 24, 39, 0.94); backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 20px rgba(245, 158, 11, 0.12);
    white-space: nowrap;
    transform: translate(-50%, -100%);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.18s ease, visibility 0.18s ease;
  }
  html[data-theme="light"] #nodeToolbar {
    background: rgba(255, 255, 255, 0.94);
  }
  #nodeToolbar.show {
    opacity: 1; visibility: visible; pointer-events: auto;
  }
  #nodeToolbar button.icon-btn {
    width: 32px; height: 32px; padding: 0; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--btn-bg); border-color: var(--border); color: var(--text);
  }
  #nodeToolbar button.icon-btn:hover { background: var(--btn-hover); }
  #nodeToolbar button.icon-btn.primary {
    background: rgba(245, 158, 11, 0.22); border-color: rgba(245, 158, 11, 0.55);
    color: #fcd34d;
  }
  #nodeToolbar button.icon-btn.primary:hover { background: #f59e0b; color: #0B0F19; border-color: #f59e0b; }
  #nodeToolbar button.icon-btn.danger {
    color: #fca5a5; border-color: rgba(248, 113, 113, 0.45);
    background: rgba(127, 29, 29, 0.35);
  }
  #nodeToolbar button.icon-btn.danger:hover {
    background: #ef4444; color: #fff; border-color: #ef4444;
  }
  #nodeToolbar button.icon-btn svg { width: 16px; height: 16px; display: block; }
  #proposePop {
    position: absolute; z-index: 12; display: block;
    width: min(320px, 80vw);
    padding: 10px; border-radius: 14px;
    background: var(--panel-solid); color: var(--text);
    border: 1px solid var(--border);
    box-shadow: 0 14px 36px rgba(0,0,0,0.45);
    transform: translate(-50%, -100%);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.18s ease, visibility 0.18s ease;
  }
  #proposePop.show {
    opacity: 1; visibility: visible; pointer-events: auto;
  }
  #proposePop label {
    display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px;
  }
  #proposeInput {
    width: 100%; min-height: 72px; resize: vertical;
    background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; font: 13px/1.4 inherit;
  }
  #proposeActions {
    display: flex; gap: 8px; align-items: center;
    justify-content: space-between; margin-top: 8px;
  }
  #proposeActionsRight { display: flex; gap: 8px; align-items: center; }
  #proposeActions button { font-size: 12px; padding: 6px 10px; border-radius: 10px; }
  #btnInspire {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.5);
    color: #fcd34d; font-weight: 700;
  }
  #btnInspire:hover { background: #f59e0b; color: #0B0F19; border-color: #f59e0b; }
  #btnInspire svg { width: 14px; height: 14px; display: block; }
  #proposeSubmit {
    background: rgba(245, 158, 11, 0.22); border-color: rgba(245, 158, 11, 0.55);
    color: #fcd34d; font-weight: 700;
  }
  #proposeSubmit:hover { background: #f59e0b; color: #0B0F19; border-color: #f59e0b; }
  #closePop {
    position: absolute; z-index: 12; display: block;
    width: min(280px, 80vw);
    padding: 10px; border-radius: 14px;
    background: var(--panel-solid); color: var(--text);
    border: 1px solid var(--border);
    box-shadow: 0 14px 36px rgba(0,0,0,0.45);
    transform: translate(-50%, -100%);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.18s ease, visibility 0.18s ease;
  }
  #closePop.show { opacity: 1; visibility: visible; pointer-events: auto; }
  #closePop .close-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  #closePop .close-desc { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
  #closeActions { display: flex; flex-direction: column; gap: 6px; }
  #closeActions button { font-size: 12px; padding: 7px 10px; border-radius: 10px; text-align: left; }
  #closeSoft {
    background: rgba(148, 163, 184, 0.18); border-color: rgba(148, 163, 184, 0.45);
  }
  #closePermanent {
    background: rgba(127, 29, 29, 0.35); border-color: rgba(248, 113, 113, 0.45); color: #fca5a5;
  }
  #closePermanent:hover { background: #ef4444; color: #fff; border-color: #ef4444; }
  #trashModal {
    position: fixed; inset: 0; z-index: 50; display: none;
  }
  #trashModal.open { display: block; }
  #trashBackdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  #trashPanel {
    position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
    width: min(520px, 92vw); max-height: 70vh; overflow: auto;
    background: var(--panel-solid); color: var(--text);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 18px 48px rgba(0,0,0,0.45); padding: 14px 16px;
  }
  #trashPanel h3 {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 0 10px; font-size: 16px;
  }
  #trashList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  #trashList li {
    border: 1px solid var(--border); border-radius: 12px; padding: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #trashList .trash-meta { font-size: 12px; color: var(--muted); }
  #trashList .trash-files { font-size: 11px; color: var(--muted); word-break: break-all; }
  #trashList .trash-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  #trashList .trash-restore {
    font-size: 12px; padding: 5px 10px; border-radius: 10px;
    background: rgba(245, 158, 11, 0.22); border-color: rgba(245, 158, 11, 0.55);
    color: #fcd34d; font-weight: 700; white-space: nowrap;
  }
  #trashEmpty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  #toolbarTip {
    position: fixed; z-index: 30; display: none;
    min-width: 72px; max-width: min(320px, 70vw);
    padding: 8px 10px;
    border-radius: 12px;
    background: var(--panel-solid); color: var(--text);
    border: 1px solid var(--border);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    pointer-events: none;
    transform-origin: top left;
  }
  #toolbarTip.show { display: block; }
  #toolbarTip .tip-name {
    font-size: 13px; font-weight: 700; line-height: 1.3;
    white-space: nowrap;
  }
  #toolbarTip .tip-purpose,
  #toolbarTip .tip-how {
    display: none;
    margin-top: 6px;
    font-size: 12px; line-height: 1.45; color: var(--muted);
    white-space: normal;
  }
  #toolbarTip .tip-how { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  #toolbarTip.stage-2 .tip-purpose,
  #toolbarTip.stage-3 .tip-purpose { display: block; }
  #toolbarTip.stage-3 .tip-how { display: block; }
  aside {
    border-left: 1px solid var(--border); background: var(--panel); backdrop-filter: blur(16px);
    padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px;
  }
  aside h2 { margin: 0; font-size: 14px; font-weight: 700; }
  aside .empty { color: var(--muted); }
  aside .field { font-size: 13px; }
  aside .field b { color: var(--muted); font-weight: 500; display: block; margin-bottom: 2px; }
  aside ul { margin: 4px 0 0; padding-left: 18px; word-break: break-all; }
  button {
    appearance: none; border: 1px solid var(--border); background: var(--btn-bg); color: var(--text);
    border-radius: 16px; padding: 8px 12px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.busy::after {
    content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 8px;
    border: 2px solid var(--muted); border-top-color: var(--text); border-radius: 50%;
    vertical-align: -2px; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translate(-50%, 12px);
    background: #1f2937; color: #f9fafb;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 12px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 600; line-height: 1.35;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    max-width: min(420px, 92vw); z-index: 80;
    box-shadow: 0 14px 36px rgba(0,0,0,0.45);
  }
  html[data-theme="light"] #toast {
    background: #111827; color: #f9fafb;
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  #settingsModal, #promptModal {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center;
  }
  #settingsModal.open, #promptModal.open { display: flex; }
  #settingsBackdrop, #promptBackdrop {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.65);
  }
  #settingsPanel, #promptPanel {
    position: relative; z-index: 1;
    background: var(--panel-solid); color: var(--text);
    border: 1px solid var(--border); border-radius: 24px;
    padding: 18px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 30px rgba(245,158,11,0.08);
    backdrop-filter: blur(18px);
  }
  html[data-theme="light"] #settingsPanel,
  html[data-theme="light"] #promptPanel {
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18), 0 0 24px rgba(217,119,6,0.08);
  }
  #settingsPanel { width: min(360px, 92vw); }
  #promptPanel {
    width: min(720px, 94vw); max-height: min(88vh, 900px);
    display: flex; flex-direction: column; gap: 12px;
  }
  #settingsPanel h3, #promptPanel h3 {
    margin: 0 0 14px; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  #promptPanel h3 { margin: 0; }
  #settingsClose, #promptClose {
    padding: 4px 8px; font-size: 16px; line-height: 1; border: none; background: transparent;
    color: var(--muted); border-radius: 14px;
  }
  #settingsClose:hover, #promptClose:hover { color: var(--text); background: var(--btn-hover); }
  #promptText {
    width: 100%; flex: 1; min-height: 280px; max-height: 60vh;
    resize: vertical; background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 18px; padding: 10px 12px;
    font: 13px/1.45 Consolas, "Cascadia Mono", "PingFang SC", monospace;
  }
  #promptActions { display: flex; gap: 8px; justify-content: flex-end; }
  #btnCopyPrompt {
    background: rgba(245, 158, 11, 0.22); border-color: rgba(245, 158, 11, 0.55);
    color: #fcd34d; font-weight: 700;
  }
  #btnCopyPrompt:hover { background: #f59e0b; color: #0B0F19; border-color: #f59e0b; }
  .settings-row { display: flex; flex-direction: column; gap: 6px; }
  .settings-row label { font-size: 13px; color: var(--muted); }
  .settings-row { margin-bottom: 12px; }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-row select {
    appearance: none; background: var(--btn-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 16px; padding: 8px 10px;
    font-size: 14px; cursor: pointer;
  }
  .settings-row select:focus { outline: 1px solid var(--amber); }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 240px; }
    aside { border-left: 0; border-top: 1px solid var(--border); }
  }
  #tourRoot {
    position: fixed; inset: 0; z-index: 80; display: none;
    pointer-events: none;
  }
  #tourRoot.open { display: block; pointer-events: auto; }
  #tourDim {
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    transition: clip-path 0.25s ease;
  }
  #tourSpot {
    position: absolute; border-radius: 18px;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.62), 0 0 0 3px var(--amber), 0 0 28px rgba(245, 158, 11, 0.55);
    pointer-events: none;
    transition: top .2s ease, left .2s ease, width .2s ease, height .2s ease;
  }
  #tourCard {
    position: absolute; z-index: 2;
    width: min(360px, calc(100vw - 28px));
    background: var(--panel-solid, #111827);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 16px 16px 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45), 0 0 24px rgba(245,158,11,0.12);
    pointer-events: auto;
  }
  html[data-theme="light"] #tourCard { background: #ffffff; }
  #tourCard h4 {
    margin: 0 0 8px; font-size: 15px; font-weight: 700;
  }
  #tourCard p {
    margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: var(--muted);
  }
  #tourCard .tour-meta {
    font-size: 12px; color: var(--muted); margin-bottom: 10px;
  }
  #tourCard .tour-actions {
    display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
  }
  #tourCard .tour-actions button { font-size: 13px; padding: 7px 12px; }
  #tourNext {
    background: rgba(245, 158, 11, 0.22); border-color: rgba(245, 158, 11, 0.55);
    color: #fcd34d; font-weight: 700;
  }
  html[data-theme="light"] #tourNext { color: #92400e; }
  #tourNext:hover { background: #f59e0b; color: #0B0F19; border-color: #f59e0b; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="projectTitle">vibe-planning</h1>
    <span class="meta" id="projectMeta"></span>
    <div id="legend" data-tour="legend">
      <span class="chip"><span class="swatch idea"></span><span data-i18n="status.idea">idea</span></span>
      <span class="chip"><span class="swatch proposed"></span><span data-i18n="status.proposed">proposed</span></span>
      <span class="chip"><span class="swatch planned"></span><span data-i18n="status.planned">planned</span></span>
      <span class="chip"><span class="swatch doing"></span><span data-i18n="status.doing">doing</span></span>
      <span class="chip"><span class="swatch done"></span><span data-i18n="status.done">done</span></span>
      <span class="chip"><span class="swatch deferred"></span><span data-i18n="status.deferred">deferred</span></span>
      <span class="chip"><span class="swatch cancelled"></span><span data-i18n="status.cancelled">cancelled</span></span>
      <span class="chip"><span class="swatch ghost"></span><span data-i18n="status.ghost">ghost</span></span>
    </div>
    <div class="actions">
      <button type="button" id="btnSync" data-tour="sync" data-i18n="sync" data-i18n-title="sync.title">Sync</button>
      <button type="button" id="btnRelayout" data-tour="relayout" data-i18n="relayout" data-i18n-title="relayout.title">Relayout</button>
      <button type="button" id="btnTrash" data-i18n="trash" data-i18n-title="trash.title">垃圾桶</button>
      <button type="button" id="btnTour" data-i18n="tour" data-i18n-title="tour.title">Tutorial</button>
      <button type="button" id="btnSettings" data-tour="settings" data-i18n="settings">⚙ Settings</button>
    </div>
  </header>
  <main>
    <div id="graph" data-tour="graph"></div>
    <aside data-tour="aside">
      <h2 data-i18n="detail.heading">Node</h2>
      <div id="detail" class="empty" data-i18n="detail.empty">Click a node for details</div>
      <button id="btnSuggest" data-tour="suggest" disabled data-i18n="suggest">Suggest from here</button>
      <div class="field" id="ghostHint" hidden>
        <b data-i18n="ghost.preview">Ghost preview</b>
        <ul id="ghostList"></ul>
      </div>
    </aside>
  </main>
</div>
<div id="nodeToolbar" role="toolbar" aria-label="Node actions" hidden>
  <button type="button" id="btnPropose" class="primary icon-btn" data-tip="propose" aria-label="提议">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>

      if (stored === 'zh-CN' || stored === 'en') return stored;

    var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
    return nav.indexOf('zh') === 0 ? 'zh-CN' : 'en';

    var pack = I18N[locale] || I18N.en;

    return key;

      if (key) el.setAttribute('title', t(key));

      if (key) el.setAttribute('placeholder', t(key));

  function collectDescendantIds(rootId) {
    var all = (data.nodes || []).concat(data.ghosts || []);
    var kids = {};
    for (var i = 0; i < all.length; i++) {
      var n = all[i];
      if (!n || !n.id || !n.parent) continue;
      if (!kids[n.parent]) kids[n.parent] = [];
      kids[n.parent].push(n.id);
    }
    var out = [];
    var stack = [rootId];
    var seen = {};
    seen[rootId] = true;
    while (stack.length) {
      var id = stack.pop();
      var ch = kids[id] || [];
      for (var j = 0; j < ch.length; j++) {
        var cid = ch[j];
        if (seen[cid]) continue;
        seen[cid] = true;
        out.push(cid);
        stack.push(cid);
      }
    }
    return out;
  }

  function normalizePositions(posMap) {
    var out = {};
    if (!posMap) return out;
    Object.keys(posMap).forEach(function (id) {
      var p = posMap[id];
      if (!p) return;
      var x = Number(p.x);
      var y = Number(p.y);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return;
      out[id] = { x: x, y: y };
    });
    return out;
  }

  function saveLayout(positions) {

    Object.keys(cleaned).forEach(function (id) {
      layoutPositions[id] = cleaned[id];

    if (!liveEnabled()) return;
    fetch('/api/layout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ positions: cleaned }),
    }).catch(function (err) {
      console.warn('[vibe-planning] saveLayout failed', err);
    });
  }

      var json = await res.json();
      var next = normalizePositions(json && json.positions);

    } catch (e) {

      if (!s) return;
      n.x = s.x;
      n.y = s.y;
      applied++;
    });
    return applied;

  function earliestDocDate(n) {
    var best = '9999-99-99';
    var docs = (n && n.docs) || [];
    for (var i = 0; i < docs.length; i++) {
      var m = String(docs[i]).match(/(\d{4}-\d{2}-\d{2})/);
      if (m && m[1] < best) best = m[1];
    }
    return best;
  }

  function normalizeSeqList(v) {
    var list = Array.isArray(v) ? v : (v == null ? [] : [v]);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var n = Number(list[i]);
      if (!Number.isFinite(n) || n < 1) continue;
      var f = Math.floor(n);
      if (out.indexOf(f) < 0) out.push(f);
    }
    out.sort(function (a, b) { return a - b; });
    return out;
  }

  function appendDoneSeq(id, seq) {
    var list = normalizeSeqList(doneOrderMap[id]);
    if (list.indexOf(seq) >= 0) return false;
    list.push(seq);
    list.sort(function (a, b) { return a - b; });
    doneOrderMap[id] = list;
    return true;
  }

  function ancestorIds(nodeId, byId) {
    var out = [];
    var cur = byId[nodeId];
    var guard = 0;
    while (cur && cur.parent && byId[cur.parent] && guard < 64) {
      out.push(cur.parent);
      cur = byId[cur.parent];
      guard += 1;
    }
    return out;
  }

  function ensureDoneOrder(tree) {
    var dirty = false;
    Object.keys(doneOrderMap).forEach(function (id) {
      var list = normalizeSeqList(doneOrderMap[id]);
      if (list.length) doneOrderMap[id] = list;
      else delete doneOrderMap[id];
    });

    var max = 0;
    Object.keys(doneOrderMap).forEach(function (id) {
      normalizeSeqList(doneOrderMap[id]).forEach(function (v) {
        if (v > max) max = v;
      });
    });

    var byId = {};
    (tree.nodes || []).forEach(function (n) {
      if (n && n.id) byId[n.id] = n;
    });

    var missing = (tree.nodes || []).filter(function (n) {
      return n && n.status === 'done' && n.id && normalizeSeqList(doneOrderMap[n.id]).length === 0;
    });
    missing.sort(function (a, b) {
      var da = earliestDocDate(a);
      var db = earliestDocDate(b);
      if (da !== db) return da < db ? -1 : 1;
      return String(a.id).localeCompare(String(b.id));
    });

    for (var i = 0; i < missing.length; i++) {
      max += 1;
      if (appendDoneSeq(missing[i].id, max)) dirty = true;
      var ancs = ancestorIds(missing[i].id, byId);
      for (var a = 0; a < ancs.length; a++) {
        if (appendDoneSeq(ancs[a], max)) dirty = true;
      }
    }

    Object.keys(doneOrderMap).forEach(function (id) {
      var seqs = normalizeSeqList(doneOrderMap[id]);
      var ancs = ancestorIds(id, byId);
      for (var s = 0; s < seqs.length; s++) {
        for (var a = 0; a < ancs.length; a++) {
          if (appendDoneSeq(ancs[a], seqs[s])) dirty = true;
        }
      }
    });

    if (dirty && liveEnabled()) {
      fetch('/api/done-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: doneOrderMap }),
      }).catch(function (err) {
        console.warn('[vibe-planning] saveDoneOrder failed', err);
      });
    }
    return dirty;
  }

  async function fetchDoneOrder() {
    try {
      var res = await fetch('/api/done-order', { cache: 'no-store' });
      if (!res.ok) return;
      var json = await res.json();
      var order = json && json.order && typeof json.order === 'object' ? json.order : {};
      doneOrderMap = {};
      Object.keys(order).forEach(function (id) {
        var list = normalizeSeqList(order[id]);
        if (list.length) doneOrderMap[id] = list;
      });
    } catch (e) {
      console.warn('[vibe-planning] fetchDoneOrder failed', e);
    }
  }

  function nodeHasSeq(node, seq) {
    return normalizeSeqList(node && node._doneSeq).indexOf(seq) >= 0;
  }

  function drawBadgeHoverFx(ctx, net) {
    if (hoverBadgeSeq == null || !nodesDS || !ctx || !net) return;
    var ids = nodesDS.getIds();
    var dim = theme === 'light' ? 'rgba(248, 250, 252, 0.62)' : 'rgba(11, 15, 25, 0.62)';
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var node = nodesDS.get(id);
      if (!node || node._ghost) continue;
      if (nodeHasSeq(node, hoverBadgeSeq)) continue;
      var box = net.getBoundingBox(id);
      if (!box) continue;
      var pad = 10;
      ctx.save();
      ctx.fillStyle = dim;
      ctx.fillRect(box.left - pad, box.top - pad, box.right - box.left + pad * 2, box.bottom - box.top + pad * 2);
      ctx.restore();
    }
  }

  function drawTriangle(ctx, x, y, dir, enabled) {
    var h = 7;
    var w = 8;
    ctx.beginPath();
    if (dir === 'up') {
      ctx.moveTo(x, y - h);
      ctx.lineTo(x - w, y + h * 0.55);
      ctx.lineTo(x + w, y + h * 0.55);
    } else {
      ctx.moveTo(x, y + h);
      ctx.lineTo(x - w, y - h * 0.55);
      ctx.lineTo(x + w, y - h * 0.55);
    }
    ctx.closePath();
    ctx.fillStyle = enabled
      ? (theme === 'light' ? 'rgba(55,65,81,0.85)' : 'rgba(226,232,240,0.9)')
      : (theme === 'light' ? 'rgba(156,163,175,0.35)' : 'rgba(107,114,128,0.35)');
    ctx.fill();
  }

  function drawDoneBadges(ctx, net) {
    if (!nodesDS || !ctx || !net) return;
    badgeHitBoxes = [];
    var ids = nodesDS.getIds();
    var perRow = 5;
    var maxRows = 5;
    var gap = 24;
    var r = 11;
    for (var i = 0; i < ids.length; i++) {
      var nodeId = ids[i];
      var node = nodesDS.get(nodeId);
      if (!node || node._ghost || !node._raw) continue;
      var seqs = sortedDoneSeqs(node);
      if (!seqs.length) continue;
      var box = net.getBoundingBox(nodeId);
      if (!box) continue;
      var totalRows = Math.ceil(seqs.length / perRow);
      var maxStart = Math.max(0, totalRows - maxRows);
      var startRow = badgeScrollByNode[nodeId] || 0;
      if (startRow > maxStart) startRow = maxStart;
      if (startRow < 0) startRow = 0;
      badgeScrollByNode[nodeId] = startRow;
      var startIdx = startRow * perRow;
      var endIdx = Math.min(seqs.length, startIdx + maxRows * perRow);
      for (var si = startIdx; si < endIdx; si++) {
        var col = si % perRow;
        var visRow = Math.floor(si / perRow) - startRow;
        var x = box.right + 3 + col * gap;
        var y = box.top - 3 + visRow * gap;
        var seq = seqs[si];
        var label = String(seq);
        var active = hoverBadgeSeq != null;
        var matched = active && hoverBadgeSeq === seq;
        var faded = active && !matched;
        badgeHitBoxes.push({ kind: 'badge', x: x, y: y, r: r + 3, seq: seq, nodeId: nodeId });
        ctx.save();
        if (faded) ctx.globalAlpha = 0.28;
        ctx.shadowColor = matched ? 'rgba(253, 224, 71, 1)' : 'rgba(245, 158, 11, 0.85)';
        ctx.shadowBlur = matched ? 20 : 12;
        ctx.beginPath();
        ctx.arc(x, y, matched ? r + 2 : r, 0, Math.PI * 2);
        ctx.fillStyle = matched ? '#fde047' : '#f59e0b';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = matched ? 3 : 2;
        ctx.strokeStyle = matched ? '#0B0F19' : 'rgba(255,255,255,0.85)';
        ctx.stroke();
        ctx.fillStyle = '#0B0F19';
        ctx.font = 'bold ' + (label.length > 2 ? 9 : 11) + 'px Segoe UI, PingFang SC, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x, y + 0.5);
        ctx.restore();
      }
      if (totalRows > maxRows) {
        var ax = box.right + 3 + perRow * gap + 10;
        var areaTop = box.top - 3;
        var areaBot = box.top - 3 + (maxRows - 1) * gap;
        var mid = (areaTop + areaBot) / 2;
        var upY = mid - 12;
        var downY = mid + 12;
        var canUp = startRow > 0;
        var canDown = startRow < maxStart;
        ctx.save();
        drawTriangle(ctx, ax, upY, 'up', canUp);
        drawTriangle(ctx, ax, downY, 'down', canDown);
        ctx.restore();
        badgeHitBoxes.push({ kind: 'scrollUp', x: ax, y: upY, r: 12, nodeId: nodeId, enabled: canUp });
        badgeHitBoxes.push({ kind: 'scrollDown', x: ax, y: downY, r: 12, nodeId: nodeId, enabled: canDown });
      }
    }
  }

  function hitTestBadge(canvasPos) {
    if (!canvasPos || !badgeHitBoxes.length) return null;
    var best = null;
    var bestD = Infinity;
    for (var i = 0; i < badgeHitBoxes.length; i++) {
      var b = badgeHitBoxes[i];
      var dx = canvasPos.x - b.x;
      var dy = canvasPos.y - b.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d <= b.r && d < bestD) {
        bestD = d;
        best = b;
      }
    }
    return best;
  }

  function sortedDoneSeqs(node) {
    return normalizeSeqList(node && node._doneSeq).slice().sort(function (a, b) { return b - a; });
  }

  function ensureBadgeSeqVisible(nodeId, seq) {
    if (!nodeId || seq == null || !nodesDS) return false;
    var node = nodesDS.get(nodeId);
    if (!node || node._ghost) return false;
    var seqs = sortedDoneSeqs(node);
    var idx = seqs.indexOf(seq);
    if (idx < 0) return false;
    var perRow = 5;
    var maxRows = 5;
    var totalRows = Math.ceil(seqs.length / perRow);
    var maxStart = Math.max(0, totalRows - maxRows);
    var row = Math.floor(idx / perRow);
    var startRow = badgeScrollByNode[nodeId] || 0;
    if (startRow > maxStart) startRow = maxStart;
    if (startRow < 0) startRow = 0;
    if (row >= startRow && row < startRow + maxRows) {
      badgeScrollByNode[nodeId] = startRow;
      return false;
    }
    var next = row < startRow ? row : row - maxRows + 1;
    next = Math.max(0, Math.min(maxStart, next));
    if (next === startRow) return false;
    badgeScrollByNode[nodeId] = next;
    return true;
  }

  function revealHoveredBadgeSeq(seq) {
    if (seq == null || !nodesDS) return false;
    var changed = false;
    var ids = nodesDS.getIds();
    for (var i = 0; i < ids.length; i++) {
      var node = nodesDS.get(ids[i]);
      if (!node || node._ghost || !nodeHasSeq(node, seq)) continue;
      if (ensureBadgeSeqVisible(ids[i], seq)) changed = true;
    }
    return changed;
  }

  function setHoverBadgeSeq(seq) {
    if (hoverBadgeSeq === seq) return;
    hoverBadgeSeq = seq;
    if (nodeDragging) return;
    if (seq != null) revealHoveredBadgeSeq(seq);
    if (network) network.redraw();
  }

  function scrollBadges(nodeId, delta) {
    if (!nodeId || !nodesDS) return false;
    var node = nodesDS.get(nodeId);
    if (!node) return false;
    var seqs = sortedDoneSeqs(node);
    var totalRows = Math.ceil(seqs.length / 5);
    var maxStart = Math.max(0, totalRows - 5);
    var cur = badgeScrollByNode[nodeId] || 0;
    var next = Math.max(0, Math.min(maxStart, cur + delta));
    if (next === cur) return false;
    badgeScrollByNode[nodeId] = next;
    if (network) network.redraw();
    return true;
  }

  function wireBadgePointer(net) {
    if (badgePointerWired || !net || !net.canvas || !net.canvas.frame) return;
    var canvas = net.canvas.frame.canvas;
    if (!canvas) return;
    badgePointerWired = true;
    canvas.addEventListener('mousemove', function (e) {
      try {
        var rect = canvas.getBoundingClientRect();
        var domPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var canvasPos = net.DOMtoCanvas(domPos);
        var hit = hitTestBadge(canvasPos);
        var clickable = hit && (hit.kind === 'badge' || hit.enabled);
        canvas.style.cursor = clickable ? 'pointer' : '';
        setHoverBadgeSeq(hit && hit.kind === 'badge' ? hit.seq : null);
      } catch (err) {
        setHoverBadgeSeq(null);
      }
    });
    canvas.addEventListener('mouseleave', function () {
      canvas.style.cursor = '';
      setHoverBadgeSeq(null);
    });
    canvas.addEventListener('mousedown', function (e) {
      try {
        var rect = canvas.getBoundingClientRect();
        var domPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var hit = hitTestBadge(net.DOMtoCanvas(domPos));
        if (!hit || (hit.kind !== 'scrollUp' && hit.kind !== 'scrollDown')) return;
        if (!hit.enabled) return;
        e.preventDefault();
        e.stopPropagation();
        scrollBadges(hit.nodeId, hit.kind === 'scrollUp' ? -1 : 1);
      } catch (err) { /* ignore */ }
    }, true);
    canvas.addEventListener('wheel', function (e) {
      try {
        var rect = canvas.getBoundingClientRect();
        var domPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var hit = hitTestBadge(net.DOMtoCanvas(domPos));
        if (!hit) return;
        if (hit.kind !== 'badge' && hit.kind !== 'scrollUp' && hit.kind !== 'scrollDown') return;
        var nodeId = hit.nodeId;
        var seqs = normalizeSeqList((nodesDS.get(nodeId) || {})._doneSeq);
        if (Math.ceil(seqs.length / 5) <= 5) return;
        e.preventDefault();
        e.stopPropagation();
        scrollBadges(nodeId, e.deltaY > 0 ? 1 : -1);
      } catch (err) { /* ignore */ }
    }, { passive: false, capture: true });
  }

  function wireNetworkToolbar(net) {
    net.on('hoverNode', function (p) {
      if (proposeLocked() || closeLocked()) {
        clearBlurTimer();
        positionToolbar();
        return;
      }
      clearBlurTimer();
      hoverNodeId = p.node;
      positionToolbar();
    });
    net.on('blurNode', function () {
      if (proposeLocked() || closeLocked()) {
        clearBlurTimer();
        positionToolbar();
        return;
      }
      scheduleHideToolbar();
    });
    net.on('dragStart', function (p) {
      nodeDragging = true;
      if (!p.nodes || !p.nodes.length) {
        subtreeDrag = null;
        return;
      }
      var rootId = p.nodes[0];
      // Ensure drag works even if a prior stabilize left the node fixed.
      try { nodesDS.update({ id: rootId, fixed: false }); } catch (e) { /* ignore */ }
      var pos = net.getPositions([rootId])[rootId];
      if (!pos) {
        subtreeDrag = null;
        return;
      }
      subtreeDrag = {
        rootId: rootId,
        lastX: pos.x,
        lastY: pos.y,
        childIds: collectDescendantIds(rootId),
      };
    });
    net.on('dragging', function (p) {
      positionToolbar();
      if (!subtreeDrag) return;
      if (!p.nodes || p.nodes.indexOf(subtreeDrag.rootId) < 0) return;
      var pos = net.getPositions([subtreeDrag.rootId])[subtreeDrag.rootId];
      if (!pos) return;
      var dx = pos.x - subtreeDrag.lastX;
      var dy = pos.y - subtreeDrag.lastY;
      subtreeDrag.lastX = pos.x;
      subtreeDrag.lastY = pos.y;
      if (dx || dy) {
        var ids = subtreeDrag.childIds;
        if (ids.length) {
          var positions = net.getPositions(ids);
          for (var i = 0; i < ids.length; i++) {
            var id = ids[i];
            var c = positions[id];
            if (!c) continue;
            net.moveNode(id, c.x + dx, c.y + dy);
          }
        }
        scheduleSaveLayout(net);
      }
    });
    net.on('dragEnd', function () {
      nodeDragging = false;
      flushSaveLayout(net);
      subtreeDrag = null;
      positionToolbar();
    });
    net.on('zoom', function () { positionToolbar(); });
    net.on('animationFinished', function () { positionToolbar(); });
    net.on('afterDrawing', function (ctx) {
      drawBadgeHoverFx(ctx, net);
      drawDoneBadges(ctx, net);
      if (nodeToolbar.classList.contains('show') || activeToolbarId()) positionToolbar();
    });
    wireBadgePointer(net);
  }

  nodeToolbar.addEventListener('mouseenter', function () {
    clearBlurTimer();

    hideToolbarTip();

  async function refreshTrashModal() {
    trashList.innerHTML = '';
    try {
      var res = await fetch('/api/trash', { cache: 'no-store' });
      var json = await res.json();
      var entries = (json && json.entries) || [];
      trashEmpty.style.display = entries.length ? 'none' : 'block';
      trashList.style.display = entries.length ? 'flex' : 'none';

        var li = document.createElement('li');

        var files = (entry.movedFiles || []).map(function (f) { return f.from; }).join(', ');
        li.innerHTML =
          '<div class="trash-row"><div><b></b><div class="trash-meta"></div></div>' +
          '<button type="button" class="trash-restore"></button></div>' +
          (files ? '<div class="trash-files"></div>' : '');
        li.querySelector('b').textContent = title;
        li.querySelector('.trash-meta').textContent =
          (entry.node && entry.node.id ? entry.node.id + ' · ' : '') +
          (entry.deletedAt || '');
        var btn = li.querySelector('.trash-restore');
        btn.textContent = t('trash.restore');
        btn.addEventListener('click', async function () {
          btn.disabled = true;
          try {
            var r2 = await fetch('/api/trash/restore', {

  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function computeDepths(allRaw) {
    var byId = {};
    allRaw.forEach(function (n) { if (n && n.id) byId[n.id] = n; });
    var memo = {};
    var visiting = {};

    function depthOf(id) {
      if (memo[id] != null) return memo[id];
      if (visiting[id]) return 0;
      visiting[id] = true;
      var n = byId[id];
      var best = 0;
      if (n) {
        var deps = Array.isArray(n.dependsOn) ? n.dependsOn : [];
        for (var i = 0; i < deps.length; i++) {
          if (!deps[i] || !byId[deps[i]]) continue;
          var d = depthOf(deps[i]) + 1;
          if (d > best) best = d;
        }
        if (n.parent && byId[n.parent]) {
          var p = depthOf(n.parent) + 0.55;
          if (p > best) best = p;
        }
      }
      visiting[id] = false;
      memo[id] = best;
      return best;
    }

    allRaw.forEach(function (n) { if (n && n.id) depthOf(n.id); });
    return memo;
  }

  var GAP_X = 210;
  var GAP_Y = 175;
  var BOX_W = 170;
  var BOX_H = 48;

  function spreadSeeds(nodesArr, depths) {
    var byLevel = {};
    nodesArr.forEach(function (n) {
      var lv = Math.round((depths[n.id] || 0) * 2) / 2;
      if (!byLevel[lv]) byLevel[lv] = [];
      byLevel[lv].push(n);
    });
    Object.keys(byLevel).forEach(function (lv) {
      var arr = byLevel[lv];
      arr.sort(function (a, b) {
        return String(a.id).localeCompare(String(b.id));
      });
      var start = -((arr.length - 1) * GAP_X) / 2;
      arr.forEach(function (n, i) {
        var h = hashStr(String(n.id));
        n.x = start + i * GAP_X + ((h % 36) - 18);
        n.y = Number(lv) * GAP_Y + (((h >> 8) % 28) - 14);
      });
    });
  }

  function resolveOverlaps(positions) {
    var ids = Object.keys(positions);
    var pad = 16;
    for (var pass = 0; pass < 8; pass++) {
      for (var i = 0; i < ids.length; i++) {
        for (var j = i + 1; j < ids.length; j++) {
          var a = positions[ids[i]];
          var b = positions[ids[j]];
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var minX = BOX_W + pad;
          var minY = BOX_H + pad;
          var ox = minX - Math.abs(dx);
          var oy = minY - Math.abs(dy);
          if (ox <= 0 || oy <= 0) continue;
          if (ox < oy) {
            var sx = (dx === 0 ? (i % 2 ? 1 : -1) : (dx > 0 ? 1 : -1)) * (ox / 2 + 2);
            a.x -= sx;
            b.x += sx;
          } else {
            var sy = (dy === 0 ? (i % 2 ? 1 : -1) : (dy > 0 ? 1 : -1)) * (oy / 2 + 2);
            a.y -= sy;
            b.y += sy;
          }
        }
      }
    }
    return positions;
  }

  function buildGraphData(tree) {
    const idSet = new Set();
    const nodesArr = [];
    const edgesArr = [];
    const list = (tree.nodes || []).slice().sort(function (a, b) {
      const sa = STATUS_ORDER[a.status] != null ? STATUS_ORDER[a.status] : 9;
      const sb = STATUS_ORDER[b.status] != null ? STATUS_ORDER[b.status] : 9;
      if (sa !== sb) return sa - sb;
      return String(a.title || a.id).localeCompare(String(b.title || b.id), 'zh');
    });
    const ghosts = tree.ghosts || [];
    const allRaw = list.concat(ghosts);
    const depths = computeDepths(allRaw);

    function addNode(n, isGhost) {
      if (!n || !n.id || idSet.has(n.id)) return;
      idSet.add(n.id);
      const st = styleFor(n.status || 'idea', isGhost);
      var doneSeqs = !isGhost ? normalizeSeqList(doneOrderMap[n.id]) : [];
      var removed = !!n.removed;
      var nodeObj = {
        id: n.id,
        label: n.title || n.id,
        ...st,
        _raw: n,
        _ghost: !!isGhost,
        _doneSeq: doneSeqs,
        _removed: removed,
      };
      if (removed) {
        nodeObj.opacity = 0.18;
        nodeObj.font = Object.assign({}, st.font, {
          color: theme === 'light' ? 'rgba(55,65,81,0.35)' : 'rgba(156,163,175,0.35)',
        });
        nodeObj.color = {
          background: theme === 'light' ? 'rgba(156,163,175,0.12)' : 'rgba(7,11,20,0.35)',
          border: theme === 'light' ? 'rgba(107,114,128,0.25)' : 'rgba(75,85,99,0.35)',
          highlight: {
            background: theme === 'light' ? 'rgba(156,163,175,0.18)' : 'rgba(17,24,39,0.45)',
            border: theme === 'light' ? 'rgba(107,114,128,0.4)' : 'rgba(107,114,128,0.5)',
          },
          hover: {
            background: theme === 'light' ? 'rgba(156,163,175,0.18)' : 'rgba(17,24,39,0.45)',
            border: theme === 'light' ? 'rgba(107,114,128,0.4)' : 'rgba(107,114,128,0.5)',
          },
        };
        nodeObj.shadow = { enabled: false, size: 0, x: 0, y: 0 };
      }
      nodesArr.push(nodeObj);
    }

    function edgeDimmed(n, otherId) {
      if (n && n.removed) return true;
      var other =
        list.find(function (x) { return x && x.id === otherId; }) ||
        ghosts.find(function (x) { return x && x.id === otherId; });
      return !!(other && other.removed);
    }

    function addEdges(n) {
      var light = theme === 'light';
      if (n.parent) {
        var pDim = edgeDimmed(n, n.parent);
        edgesArr.push({
          id: 'p:' + n.parent + '>' + n.id,
          from: n.parent, to: n.id, arrows: { to: { enabled: true, scaleFactor: 0.85 } },
          color: {
            color: pDim
              ? (light ? 'rgba(75, 85, 99, 0.12)' : 'rgba(75, 85, 99, 0.18)')
              : (light ? 'rgba(75, 85, 99, 0.9)' : 'rgba(156, 163, 175, 0.95)'),
            highlight: light ? '#d97706' : '#f59e0b',
            hover: light ? '#b45309' : '#fcd34d',
            opacity: pDim ? 0.12 : 0.95,
          },
          width: pDim ? 1.2 : 3.5,
          selectionWidth: 5,
          length: 140,
          smooth: false,
          shadow: pDim ? { enabled: false } : {
            enabled: true,
            color: light ? 'rgba(75,85,99,0.25)' : 'rgba(156,163,175,0.45)',
            size: 10, x: 0, y: 0,
          },
        });
      }
      const deps = Array.isArray(n.dependsOn) ? n.dependsOn : [];
      for (const d of deps) {
        if (!d) continue;
        var dDim = edgeDimmed(n, d);
        edgesArr.push({
          id: 'd:' + d + '>' + n.id,
          from: d, to: n.id, arrows: { to: { enabled: true, scaleFactor: 0.75 } },
          color: {
            color: dDim
              ? (light ? 'rgba(2, 132, 199, 0.1)' : 'rgba(56, 189, 248, 0.12)')
              : (light ? 'rgba(2, 132, 199, 0.55)' : 'rgba(56, 189, 248, 0.55)'),
            highlight: light ? '#0284c7' : '#38bdf8',
            hover: light ? '#0369a1' : '#7dd3fc',
            opacity: dDim ? 0.1 : 0.7,
          },
          width: dDim ? 1 : 2.5,
          selectionWidth: 4,
          dashes: [8, 6],
          length: 230,
          smooth: false,
          shadow: dDim ? { enabled: false } : {
            enabled: true,
            color: light ? 'rgba(2,132,199,0.25)' : 'rgba(56,189,248,0.35)',
            size: 12, x: 0, y: 0,
          },
        });
      }
    }

    list.forEach(function (n) { addNode(n, false); });
    ghosts.forEach(function (n) { addNode(n, true); });
    spreadSeeds(nodesArr, depths);
    applyLayoutToNodes(nodesArr);
    list.forEach(addEdges);
    ghosts.forEach(addEdges);
    return { nodesArr: nodesArr, edgesArr: edgesArr };
  }

  const netOpts = {
    physics: {

      barnesHut: {

  let lastTreeFp = '';

  function treeFingerprint(tree) {
    try { return JSON.stringify(tree || {}); } catch { return String(Date.now()); }

  function structureFingerprint(built) {
    const n = (built.nodesArr || []).map(function (x) { return x.id; }).sort().join(',');
    const e = (built.edgesArr || []).map(function (x) { return x.id || (x.from + '>' + x.to); }).sort().join(',');
    return n + '|' + e;
  }

  var stabilizeGen = 0;
  var nodeDragging = false;

  function unfixAllNodes() {
    if (!nodesDS) return;
    var ids = nodesDS.getIds();
    for (var i = 0; i < ids.length; i++) {
      nodesDS.update({ id: ids[i], fixed: false });
    }
  }

  function stabilizeThenFreeze(doFit) {
    if (!network || !nodesDS) return;
    var gen = ++stabilizeGen;
    var ids = nodesDS.getIds();
    var fixedIds = [];
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      if (!layoutPositions[id]) continue;
      nodesDS.update({ id: id, fixed: { x: true, y: true } });
      fixedIds.push(id);
    }
    function applyFinal(doPhysicsCleanup) {
      if (gen !== stabilizeGen) return;
      network.setOptions({ physics: { enabled: false } });
      var pos = doPhysicsCleanup ? resolveOverlaps(network.getPositions()) : network.getPositions();
      Object.keys(layoutPositions).forEach(function (id) {
        if (!pos[id]) return;
        pos[id] = { x: layoutPositions[id].x, y: layoutPositions[id].y };
      });
      Object.keys(pos).forEach(function (id) {
        network.moveNode(id, pos[id].x, pos[id].y);
      });
      unfixAllNodes();
      if (doFit || !didInitialFit) {
        network.fit({ animation: false });
        didInitialFit = true;
      }
    }
    if (fixedIds.length && fixedIds.length === ids.length) {
      applyFinal(false);
      return;
    }
    network.setOptions({ physics: { enabled: true } });
    network.once('stabilizationIterationsDone', function () {
      applyFinal(true);
    });
    // Failsafe: never leave nodes permanently fixed if stabilization is interrupted.
    setTimeout(function () {
      if (gen !== stabilizeGen) return;
      applyFinal(true);
    }, 2500);
  }

  function renderTree(tree, opts) {
    opts = opts || {};
    const next = tree || data;
    const fp = treeFingerprint(next);
    if (!opts.force && fp && fp === lastTreeFp && network) {
      return;
    }
    lastTreeFp = fp;
    data = next;
    window.PLAN_TREE = data;
    updateMeta();
    const built = buildGraphData(data);
    const structFp = structureFingerprint(built);
    const structureChanged = structFp !== lastStructFp;

    if (!network) {
      lastStructFp = structFp;
      nodesDS = new vis.DataSet(built.nodesArr);
      edgesDS = new vis.DataSet(built.edgesArr);
      var graphEl = document.getElementById('graph');
      network = new vis.Network(
        graphEl,
        { nodes: nodesDS, edges: edgesDS },
        netOpts
      );
      // vis-network clears container children; re-attach floating toolbar
      nodeToolbar.hidden = false;
      graphEl.appendChild(nodeToolbar);
      graphEl.appendChild(proposePop);
      graphEl.appendChild(closePop);
      network.on('click', function (p) {
        if (proposeLocked()) {
          if (network && proposeSourceId) {
            try { network.selectNodes([proposeSourceId]); } catch (e) { /* ignore */ }
          }
          positionToolbar();
          return;
        }
        if (closeLocked()) {
          if (network && closeSourceId) {
            try { network.selectNodes([closeSourceId]); } catch (e) { /* ignore */ }
          }
          positionToolbar();
          return;
        }
        if (!p.nodes.length) {
          hoverNodeId = null;
          showDetail(null);
          hideToolbar();
          return;
        }
        showDetail(nodesDS.get(p.nodes[0]));
      });
      wireNetworkToolbar(network);
      stabilizeThenFreeze(true);
      return;
    }

    const pos = network.getPositions();
    const sel = selected && selected.id;
    const byId = {};
    built.nodesArr.forEach(function (n) {
      if (pos[n.id]) {
        n.x = pos[n.id].x;
        n.y = pos[n.id].y;
      } else if (layoutPositions[n.id]) {
        n.x = layoutPositions[n.id].x;
        n.y = layoutPositions[n.id].y;
      }
      n.fixed = false;
      byId[n.id] = n;
    });

    const keepIds = new Set(Object.keys(byId));
    nodesDS.getIds().forEach(function (id) {
      if (!keepIds.has(id)) nodesDS.remove(id);
    });
    built.nodesArr.forEach(function (n) {
      if (nodesDS.get(n.id)) nodesDS.update(n);
      else nodesDS.add(n);
    });

    const edgeIds = new Set(built.edgesArr.map(function (e) { return e.id; }));
    edgesDS.getIds().forEach(function (id) {
      if (!edgeIds.has(id)) edgesDS.remove(id);
    });
    built.edgesArr.forEach(function (e) {
      if (edgesDS.get(e.id)) edgesDS.update(e);
      else edgesDS.add(e);
    });

    lastStructFp = structFp;
    if (structureChanged || opts.forcePhysics) {
      stabilizeThenFreeze(!!opts.forceFit);
    } else {
      network.setOptions({ physics: { enabled: false } });
      unfixAllNodes();
    }

    if (sel && nodesDS.get(sel)) {
      showDetail(nodesDS.get(sel));
      network.selectNodes([sel]);
    }
  }

  const themeSelect = document.getElementById('themeSelect');
  const layoutModeSelect = document.getElementById('layoutModeSelect');
  themeSelect.addEventListener('change', function () {
    setTheme(themeSelect.value);
  });
  localeSelect.addEventListener('change', function () {
    setLocale(localeSelect.value);
  });
  layoutModeSelect.addEventListener('change', function () {
    setLayoutMode(layoutModeSelect.value);
  });

  btnCopyPrompt.addEventListener('click', function () {
    var text = promptText.value || '';
    function done() { toast(t('toast.copied')); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        promptText.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { window.prompt(t('toast.copyPrompt'), text); done(); }
      });
    } else {
      promptText.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { window.prompt(t('toast.copyPrompt'), text); done(); }
    }
  });

  function relatedGhosts(nodeId) {
    return (data.ghosts || []).filter(function (g) {
      return g.parent === nodeId ||
        (Array.isArray(g.dependsOn) && g.dependsOn.indexOf(nodeId) >= 0);
    });
  }

  function lookupNodeRaw(id) {
    if (!id || !data) return null;
    var nodes = data.nodes || [];
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i] && nodes[i].id === id) return nodes[i];
    }
    var ghosts = data.ghosts || [];
    for (var j = 0; j < ghosts.length; j++) {
      if (ghosts[j] && ghosts[j].id === id) return ghosts[j];
    }
    return null;
  }

  function formatNodeRef(id) {
    if (!id) return '';
    var n = lookupNodeRaw(id);
    var title = n && n.title ? String(n.title) : String(id);
    if (n && n.title && n.title !== id) {
      return title + ' <span style="color:var(--muted)">(' + id + ')</span>';
    }
    return title;
  }

  function showDetail(node) {
    if (proposeLocked() && node && node.id !== proposeSourceId) return;
    if (proposeLocked() && !node) return;
    if (closeLocked() && node && node.id !== closeSourceId) return;
    if (closeLocked() && !node) return;
    selected = node;
    if (!node) {
      detail.className = 'empty';
      detail.removeAttribute('data-i18n');
      detail.textContent = t('detail.empty');
      btn.disabled = true;
      ghostHint.hidden = true;
      if (!hoverNodeId) hideToolbar();
      else positionToolbar();
      return;
    }
    const r = node._raw || {};
    detail.className = '';
    detail.removeAttribute('data-i18n');
    const docs = (r.docs || []).map(function (d) { return '<li>' + d + '</li>'; }).join('');
    const stCode = r.status || '';
    const stShown = stCode ? (statusLabel(stCode) + ' <span style="color:var(--muted)">(' + stCode + ')</span>') : '';
    const depsShown = (r.dependsOn || []).map(formatNodeRef).join('<br>');
    detail.innerHTML =
      '<div class="field"><b>' + t('field.id') + '</b>' + r.id +
        (node._ghost ? ' <em>' + t('ghost.tag') + '</em>' : '') + '</div>' +
      '<div class="field"><b>' + t('field.title') + '</b>' + (r.title || '') + '</div>' +
      '<div class="field"><b>' + t('field.status') + '</b>' + stShown + '</div>' +
      (r.kind ? '<div class="field"><b>' + t('field.kind') + '</b>' + r.kind + '</div>' : '') +
      (r.parent ? '<div class="field"><b>' + t('field.parent') + '</b>' + formatNodeRef(r.parent) + '</div>' : '') +
      (depsShown
        ? '<div class="field"><b>' + t('field.dependsOn') + '</b>' + depsShown + '</div>' : '') +
      (docs ? '<div class="field"><b>' + t('field.docs') + '</b><ul>' + docs + '</ul></div>' : '') +
      (r.notes ? '<div class="field"><b>' + t('field.notes') + '</b>' + r.notes + '</div>' : '');
    btn.disabled = !!node._ghost;

    const gs = relatedGhosts(r.id);
    if (gs.length) {
      ghostHint.hidden = false;
      ghostList.innerHTML = gs.map(function (g) {
        return '<li>' + (g.title || g.id) +
          ' <span style="color:var(--muted)">(' + g.id + ')</span></li>';
      }).join('');
    } else {
      ghostHint.hidden = true;
    }
    positionToolbar();
  }

  btn.addEventListener('click', function () {
    if (!selected || selected._ghost) return;
    copyText(buildInspirePrompt(selected._raw || {}), 'toast.inspireCopied');
  });

  btnSync.addEventListener('click', async function () {
    btnSync.disabled = true;
    btnSync.classList.add('busy');
    toast(t('toast.syncing'));
    try {
      const res = await fetch('/api/sync', { method: 'POST' });
      const json = await res.json();
      lastSyncSummary = json.summary || '';
      updateMeta();
      toast(json.summary || (json.ok ? t('toast.syncDone') : t('toast.syncFail')));
      await reloadTree({ force: true });
      if (json.prompt) openPromptModal(json.prompt);
    } catch (e) {
      toast(t('toast.syncFailWith') + (e && e.message ? e.message : e));
    } finally {
      btnSync.disabled = false;
      btnSync.classList.remove('busy');
    }
  });

  btnRelayout.addEventListener('click', function () {
    runRelayout();
  });

  function liveEnabled() {
    return location.protocol === 'http:' || location.protocol === 'https:';
  }

  async function reloadTree(opts) {
    try {
      const res = await fetch('/api/tree', { cache: 'no-store' });
      if (!res.ok) return;
      const tree = await res.json();
      await fetchLayout();
      await fetchDoneOrder();
      ensureDoneOrder(tree);
      renderTree(tree, opts || {});
      maybeAutoTour();
    } catch { /* static file:// bootstrap */ }
  }

  applyTheme();
  applyLayoutMode();
  applyLocale();

  if (liveEnabled()) {
    reloadTree({ force: true, forcePhysics: true, forceFit: true });
    try {
      const es = new EventSource('/api/events');
      es.addEventListener('reload', function () { reloadTree(); });
      es.onerror = function () { /* ignore; poll is slow backup */ };
    } catch { /* ignore */ }
    setInterval(function () { reloadTree(); }, 10000);
  } else {
    renderTree(data, { force: true, forcePhysics: true, forceFit: true });
    maybeAutoTour();
  }
})();
</script>
</body>
</html>
